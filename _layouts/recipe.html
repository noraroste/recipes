---
layout: page
---
<div id="recipe-edit-root" data-recipe-slug="{{ page.name | remove: '.md' }}">

  <div id="recipe-view-section">
    {% if page.servings %}<p><strong>Porsjoner:</strong> {{ page.servings }}</p>{% endif %}

    {{ content }}

    <p><a href="{{ page.source_url }}" target="_blank" rel="noopener">Se originaloppskrift</a></p>

    <button id="edit-btn" class="btn btn-outline-secondary btn-sm mt-3" style="display:none">Rediger oppskrift</button>
    <button id="recipe-login-btn" class="btn btn-outline-primary btn-sm mt-3" style="display:none">Logg inn for å redigere</button>
  </div>

  <div id="recipe-edit-section" style="display:none">
    <div class="mb-3">
      <textarea id="edit-raw" class="form-control" rows="30" style="font-family: monospace; font-size: 0.85rem;"></textarea>
    </div>
    <button id="save-btn" class="btn btn-outline-primary me-2">Lagre</button>
    <button id="cancel-btn" class="btn btn-outline-secondary">Avbryt</button>
    <p id="edit-status-msg" class="mt-2 fst-italic text-muted"></p>
  </div>

</div>

<script src="{{ '/assets/js/auth.js' | relative_url }}"></script>
<script src="{{ '/assets/js/recipe-edit.js' | relative_url }}"></script>
